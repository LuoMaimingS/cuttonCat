server {
    # 监听 80 端口（HTTP）
    listen 80;
    
    # 替换为您实际的域名，如果有多个可以用空格隔开，如：cottoncat.com www.cottoncat.com
    # 如果暂时没有域名只是想通过服务器 IP 访问，可以写下您的公网 IP 或者直接用下划线 "_" 
    server_name yourdomain.com; 

    # 日志记录路径（可选，建议开启方便排查问题）
    # 请确保 /var/log/nginx/ 目录存在
    access_log /var/log/nginx/cotton_cat_access.log;
    error_log /var/log/nginx/cotton_cat_error.log;

    # 核心配置：将所有请求反向代理到 pm2 运行的 8080 端口
    location / {
        proxy_pass http://127.0.0.1:8080;
        
        # 传递客户端真实 IP 和协议等信息给后端的 Node 服务
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 代理超时时间设置（可根据实际情况调整）
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 【进阶优化】直接让 Nginx 处理静态资源（可选）
    # Nginx 处理静态文件的性能远高于 Node.js。您可以取消下方注释，
    # 让 Nginx 直接返回 dist 目录下的 JS/CSS/图片，而不经过 pm2。
    # ⚠️ 注意：需要将 alias 后面的路径替换为您服务器上项目 dist 文件夹的绝对路径！
    
    # location /assets/ {
    #     alias /您的服务器绝对路径/cotton_cat/dist/assets/;
    #     expires 30d;
    #     add_header Cache-Control "public, no-transform";
    # }
}
